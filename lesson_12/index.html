<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB Service Admin Panel</title>
    <link rel="stylesheet" type="text/css" href="style/style.css">
</head>
<body>
<header>
    <div class="logo">WebDev<span>Console</span></div>
    <nav>
        <ul>
            <li><a href="#">Проєкти</a></li>
            <li><a href="#">Домени</a></li>
            <li><a href="#">Налаштування</a></li>
        </ul>
    </nav>
</header>
<div class="wrapper">
    <main>
        <h1>Ваші вебсайти</h1>
        <article class="card-grid">
            <section class="web-card">
                <div class="preview-box">
                    <img src="img/preview.jpg" alt="">
                    <span class="status online">Live</span>
                </div>
                <div class="card-info">
                    <h2>www.mysite.com.ua</h2>
                </div>
            </section>
        </article>
    </main>
</div>
</body>
</html>
